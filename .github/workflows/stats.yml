
name: Verify GitHub Statistics Access

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub token and profile
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: kaanirmak
        run: |
          set -euo pipefail

          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "GH_STATS_TOKEN secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            -o /tmp/auth-user.json

          AUTH_USER=$(jq -r '.login' /tmp/auth-user.json)
          echo "Authenticated GitHub account: $AUTH_USER"

          echo "--- Checking Token OAuth Scopes ---"
          SCOPES=$(curl -sI -H "Authorization: Bearer $GH_STATS_TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes:' || echo "x-oauth-scopes: none/fine-grained")
          echo "$SCOPES"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$GH_USERNAME" \
            -o /tmp/profile.json

          echo "Profile lookup successful."
          echo "Public repository count: $(jq -r '.public_repos' /tmp/profile.json)"

          echo "--- Testing GraphQL Stats Access (Commits, Private Contributions, PRs) ---"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_STATS_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"query\": \"query { user(login: \\\"$GH_USERNAME\\\") { pullRequests(first: 1) { totalCount } issues(first: 1) { totalCount } contributionsCollection { totalCommitContributions restrictedContributionsCount } } }\"}" \
            https://api.github.com/graphql \
            -o /tmp/graphql-stats.json

          echo "GraphQL query result:"
          jq '.' /tmp/graphql-stats.json
